server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a returning visitor keeps loading the
    # previous build's asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app uses a hash router, so the server only ever serves the shell —
    # `/#/cars` never reaches nginx as a path. try_files is here for a direct
    # request to a stale or mistyped URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
